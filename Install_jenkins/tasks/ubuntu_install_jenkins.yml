---
# Install Jenkins on the target machine
# This task installs Jenkins using the official Jenkins repository.
# It also ensures that Java is installed as a prerequisite.
# Variables:
#   jenkins_repo_url: The URL of the Jenkins repository
#     (default: https://pkg.jenkins.io/debian-stable/)
#   jenkins_repo_key_url: The URL of the Jenkins repository key
#     (default: https://pkg.jenkins.io/debian-stable/jenkins.io.key)
#   jenkins_home: The home directory for Jenkins (default: /var/lib/jenkins)
#   jenkins_user: The user to run Jenkins (default: jenkins)
#   jenkins_group: The group to run Jenkins (default: jenkins)
#   jenkins_service_state: The desired state of the Jenkins service
#     (default: started)
#   jenkins_service_enabled: Whether to enable Jenkins service at boot
#     (default: true)
#   jenkins_port: The port Jenkins will listen on (default: 8080)
#   jenkins_admin_password: The initial admin password for Jenkins
#     (default: autogenerated)
#   jenkins_plugins: A list of Jenkins plugins to install (default: [])
#   jenkins_backup_schedule: The cron schedule for Jenkins backups
#     (default: "0 2 * * *")
#   jenkins_backup_retention: The number of backups to retain (default: 7)
#   jenkins_firewall_rule: Whether to configure firewall for Jenkins
#     (default: true)
#   jenkins_firewall_port: The port to open in the firewall for Jenkins
#     (default: 8080)
#   jenkins_firewall_protocol: The protocol for the firewall rule (default: tcp)
#   jenkins_proxy: Proxy settings for Jenkins (default: none)
#   jenkins_proxy_url: The URL of the proxy server (default: none)

# Load necessary variables
- name: Load Jenkins installation variables
  include_vars: "{{ role_path }}/vars/ubuntu.yml"

- name: Ensure that required variables are defined
  assert:
    that:
      - jenkins_repo_url is defined
      - jenkins_repo_key_url is defined
      - jenkins_service_state is defined
      - jenkins_service_enabled is defined
      - jenkins_port is defined
      - jenkins_admin_password is defined
      - jenkins_plugins is defined
      - jenkins_user is defined
      - jenkins_group is defined
      - jenkins_home is defined
    fail_msg: "One or more required Jenkins variables are not defined."

- name: Ensure Java is installed
  apt:
    name: "{{ item}}"
    state: present
  loop:
    - fontconfig
    - openjdk-21-jre

- name: Add Jenkins repository key
  apt_key:
    url: "{{ jenkins_repo_key_url }}"
    state: present

- name: Add Jenkins repository
  apt_repository:
    repo: "deb {{ jenkins_repo_url }} binary/"
    state: present

- name: Install Jenkins
  apt:
    name: jenkins
    state: present
    update_cache: yes

# Copy Jenkins configuration file if needed
- name: Copy Jenkins configuration file
  template:
    src: jenkins_config.xml.j2
    dest: /etc/jenkins/jenkins.xml
  notify: Restart Jenkins

- name: Ensure Jenkins service is running and enabled
  service:
    name: jenkins
    state: "{{ jenkins_service_state }}"
    enabled: "{{ jenkins_service_enabled }}"

- name: Configure plugins
  jenkins_plugin:
    name: "{{ item }}"
    state: present
  loop: "{{ jenkins_plugins }}"
  notify: Restart Jenkins
