---
jenkins_repo_url: https://pkg.jenkins.io/debian-stable/
#jenkins_repo_key_url: https://pkg.jenkins.io/debian-stable/jenkins.io.key
jenkins_repo_key_url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
jenkins_home: /var/lib/jenkins
jenkins_user: jenkins
jenkins_group: jenkins
jenkins_service_state: started
jenkins_service_enabled: true
jenkins_port: 8080
jenkins_admin_password: autogenerated
jenkins_plugins: ["git", "workflow-aggregator", "blueocean"]
jenkins_backup_schedule: "0 2 * * *"
jenkins_backup_retention: 7
jenkins_firewall_rule: true
jenkins_firewall_port: 8080
jenkins_firewall_protocol: tcp
jenkins_proxy: none
jenkins_proxy_url: none

...
