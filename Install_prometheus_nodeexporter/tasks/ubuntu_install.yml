---
- name: Load ubuntu variables
  include_vars: ubuntu.yml

- name: Ensure node_exporter user exists
  user:
    name: "{{ node_exporter_user }}"
    system: yes
    shell: /usr/sbin/nologin"

- name: Download node exporter archive
  get_url:
    url: >-
      https://github.com/prometheus/node_exporter/releases/download/v
      {{ node_exporter_version }}
      /node_exporter-
      {{ node_exporter_version }}
      .linux-amd64.tar.gz"
    dest: "/tmp/node_exporter.tar.gz"
    mode: '0644'

- name: Extract node exporter archive
  unarchive:
    src: "/tmp/node_exporter.tar.gz"
    dest: "/tmp"
    remote_src: yes

- name: Copy node exporter binary
  copy:
    remote_src: true
    src: >-
      /tmp/node_exporter-
      {{ node_exporter_version }}
      .linux-amd64/node_exporter"
    dest: "{{ install_dir }}/node_exporter"
    mode: '0755'
    backup: true

- name: Create systemd service file
  copy:
    remote_src: true
    dest: "{{ node_exporter_service }}"
    mode: '0644'
    backup: true
    content: |
      [Unit]
      Description=Node Exporter
      After=network.target
      [Service]
      User={{ node_exporter_user }}
      Group={{ node_exporter_user }}
      Type=simple
      ExecStart={{ install_dir }}/node_exporter
      [Install]
      WantedBy=multi-user.target

- name: Reload systemd
  systemd:
    daemon_reload: yes

- name: Enable and start node exporter
  systemd:
    name: node_exporter
    state: started
    enabled: yes

...
